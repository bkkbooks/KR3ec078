body:
  text: 卷下桃仁主治瘀血少腹滿痛故兼治腸癰及婦人經水不利考證桃仁承氣湯證曰少腹急結大黃牡丹皮湯證曰少腹腫痞葦莖湯證不具上三方桃仁各五十枚下瘀血湯證曰産婦腹痛又曰經水不利上一方桃仁三十枚大蟅蟲丸證曰腹滿上一方桃仁一升抵當丸證曰少腹滿上一方桃仁二十五枚抵當湯證曰少腹當硬滿又曰婦人經水不利上一方桃仁二十枚桂枝茯苓丸證不具上一方桃仁諸藥等分據此諸方則桃仁主治瘀血急結少腹滿痛明矣凡毒結於少腹則小便不利或如淋其如此者後必有膿自下或瀉血者或婦人經水不利者是又臍下久瘀血之所致也互考桃仁承氣湯證曰熱結膀胱其人如狂其雖血自下下者愈此似無醫治所預也豈非自愈之證乎雖然熱結膀胱其人如狂者雖其血自下亦有少腹急結證也若或有前證而血不自下少腹急結者亦宜與此方攻之猶産後血不自下瘀熱上衝少腹急結者夫急結者必滿痛是桃仁五十枚所主也故云服湯已其血必自下大便微利則愈然則桃仁治少腹急結滿痛明矣後世醫者未見其血自下而但見少腹急結以為熱結膀胱豈不想像之治乎余故曰熱結膀胱四字後人妄添可知焉下者愈脈經作下之則愈為是大黃牡丹皮湯後世以為治腸癰之方雖然此方豈唯治腸癰矣乎凡治諸瘍膿未成者苟膿已成者非此方之所治也至少腹腫痞按之即痛如淋小便自調其脈遲緊者則此方之所治也如彼時時發熱自汗出復惡寒證此為腸癰表證也是非此方之所治也若有少腹腫痞按之即痛如淋小便自調其脈遲緊證則不問其腸癰也否又不問其瘀血也否宜與此方何以不問其腸癰也否又不問其瘀血也否而與此方乎曰觀少腹腫痞按之即痛如淋小便自調證而後宜與此方況於其脈遲緊者乎故方證相對則血必自下若其脈洪數則膿已成非此方之所宜也是所謂觀其脈證也雖然不隨其脈遲緊而今隨其少腹腫痞按之即痛如淋小便自調證是所謂隨證治之也然則少腹腫痞者是桃仁所主明矣葦莖湯證不具但謂咳有微熱煩滿胸中甲錯是為肺癰是外證也以此四證名肺癰者非疾醫之義今不取焉雖然因胸中甲錯證則知瘀血內結矣因咳有微熱煩滿證則知瘀血欲成膿矣不可不以此方吐之況又云再服當吐如膿則知胸中瘀血遂化成膿矣是所以有咳有微熱煩滿證也夫葦莖蓬朮苡仁桃仁瓜瓣皆有化血成膿之功也今雖曰當吐如膿亦吐者皆膿也瘀血所化也由此觀之則桃仁雖曰治少腹瘀血亦變用則有治胸腹瘀血結痛之功是所以方有桃仁五十枚也下瘀血湯方治臍下毒痛及婦人經水不利毒痛者故後人此為腹中有乾血著臍下夫不問乾血也否苟有臍下毒痛證則宜與此方雖然服之新血下如豚肝或經水利者腹中臍下所著乾血共下明矣唯新字可疑由此觀之則下瘀血湯之名蓋後人所命焉余以為此方本是丸方疑古有小蟅蟲丸之名方銘不傳故後人名曰下瘀血之湯但以蜜和為丸以酒煎之似非湯法下條有大蟅蟲丸可並考又按法曰産婦腹痛法當以枳實芍藥散假令不愈者此為腹中有乾血著臍下夫腹痛煩滿不得臥豈唯産後有之乎産後最多此證也治以枳實芍藥散者是法也以法治之而不愈者診之腹中有毒而痛著於臍下此為腹中有乾血著臍下矣故今轉其方用下瘀血湯下之曰未見其血自下而用此方者何也曰今用芍藥治腹痛用枳實治煩滿不得臥而不愈者蓋産時已見瘀血續自下今瘀血不續自下是必乾血著臍下使瘀血不自下是以腹痛煩滿不得臥也不可不以此方下之故服湯後新血又下如豚肝謂之方證相對也若不見血自下而但用此方治臍下毒痛者不想像臆度之治而何也若有瘀血則當有臍下甲錯及結痛證以此二法候內有瘀血故今用桃仁三十枚此為治瘀血毒痛所以用蟅蟲破之用大黃下之也類聚方産後二字加曲截者蓋此方不但治婦人産後腹痛矣雖男子亦有瘀血自下臍下毒痛證則宜服此方服湯已瘀血又自下者愈方極但云臍下毒痛是不問瘀血也否與此方之謂也由是觀之謂之乾血著臍下亦屬想象臆度不可從焉大蟅蟲丸證者後世所謂勞瘵也故金匱要略有五勞七傷虛極及緩中補虛之説豈仲景之言哉是蓋後人妄添或注文誤入不俟余辨但至羸瘦腹滿不能飲食內有乾血肌膚甲錯兩目黯黑證則此方所宜也杶按此方蓋古來相傳之方而仲景取以治傷寒瘥後有此證者此人本有久瘀血今患傷寒故瘥後又見此證故用四蟲及桃仁乾漆地黃大黃以破血行瘀況有桃仁一升乎夫乾血者久瘀血也苟有久瘀血則必有肌膚甲錯腹滿證也可以見矣桂枝茯苓丸證不悉具雖然此方本五味等分則一藥各治一證故宜以一藥之功而分治一證矣按此方蓋治瘀血上衝腹中毒痛心下悸及婦人胎動血自下或經水有變者故法曰漏下不止胎動在臍上者是也由此觀之則桃仁非主少腹有毒瘀血自下與不下乎余故曰桃仁之功大抵與牡丹皮相似矣蓋以治腹中及臍下毒痛故也金匱要略此方之條古今諸家注解不得其義余嘗作此解今不贅於此東洞翁嘗立診察瘀血三法其説盡矣仲景又別有診察瘀血外證之法曰其身甲錯曰胸中甲錯胸中蓋心胸上也曰肌膚甲錯此三法宜以甲錯而診察瘀血也二方皆有桃仁故今附於此辨誤李杲云桃仁治熱入血室杲之言過矣夫仲景治熱入血室證無有用桃仁之方本論太陽下篇治熱入血室者有二法一刺期門一用小柴胡湯一不載其方矣未嘗見用桃仁者治血豈惟用桃仁乎品考桃仁惟一品無萃渡者姦商或雜梅仁不可不擇我們去皮不去尖巴豆主治心腹胸膈之毒故兼治心腹猝痛脹滿吐膿考證桔梗白散證曰咳而胸滿及吐膿備急丸證曰心腹脹滿猝痛九痛丸證曰心痛及腹脹痛以上三方巴豆各一兩走馬湯證曰心痛腹脹上一方巴豆二枚據此諸方則巴豆或一兩或二枚然本與諸藥等分但白散之方巴豆一兩以配桔梗貝母各三兩金匱要略九痛丸方附子本作三兩余皆等分千金方但作一兩蓋作一兩則附子亦與諸藥等分今從此凡仲景之用巴豆也雖備於急卒之病皆是驅逐膈間之毒物蕩滌腸胃之閉塞故諸方皆為等分夫巴豆同桔梗用則使毒成膿同貝母用則能去咽喉之毒同杏仁用則能驅心胸之毒同大黃乾薑用則能吐下心腹結毒急痛同附子吳茱萸用則能治心中寒冷毒痛仲景之方用巴豆者唯此四方大抵足盡巴豆之功效矣互考走馬湯備急圓九痛丸三方皆不載諸本論而載諸金匱要略蓋脫誤矣走馬湯證曰中惡又曰通治飛尸鬼擊病千金方走馬湯證曰治肺臟飛尸鬼注因名曰飛尸走馬湯九痛丸證曰兼治卒中惡備急圓證曰若中惡客忤停尸卒死者按上三方證曰飛尸曰鬼注曰鬼擊曰中惡曰客忤曰停尸皆是晉唐醫人之所附會而決非仲景之意又非疾醫家之言古者巫醫並稱故後世遂以巫者之言混於醫事實晉唐醫人之所為也故彼所前言諸證似證非證孰惡孰鬼將何以分別之乎不可從焉假令巫有前數事亦於醫事何與之有故隨其證而後治之則何必論是惡是鬼乎哉若夫天地之間有惡者有鬼者有尸者有注者有停者有忤者亦人無一毒畜積於身軀間者則是惡是鬼亦豈有注之擊之中之忤之者矣乎此人嘗有一毒畜積於身軀間者故是惡是鬼亦能注之擊之中之忤之也醫者宜治其一毒而已晉唐醫人之説不可從矣況於宋明之醫説乎辨誤桔梗白散法曰強人飲服半錢匕羸者減之又曰若下多不止飲冷水一杯則定走馬湯法曰老少量之九痛丸法曰強人初服三丸日三服弱者二丸但備急圓最備其急卒之病而其服法無量老少強弱者何也曰此方者最備其急卒之病則服法不必量老少強弱也夫病苟至急卒則豈遑於量老少強弱乎宜隨其毒淺深輕重治之耳如彼走馬湯白散證卻急於備急圓證矣然今雲量其老少強弱者恐非仲景之意也蓋仲景之治病也惟隨其證而治之故其證重則方亦多服之其證輕則方亦少服之故雖強人其證輕則方亦隨少服之雖羸者而其證重則方亦隨多服之是仲景隨證治之之法也何必羸者弱者減之強人壯人多服之乎所謂量老少強弱者是唯為粗工垂其戒者歟醫之守之慎之至也至彼飲冷水止其下多者最是後人之恐巴豆者之言其妄添亦可知己凡恐藥者不知恐病者也不知恐病者則病不可得而治焉是醫者之所常病也今也不然有醫而恐藥者是不知治病之方法與察病之規則者也無如之何而已夫病人之恐醫也恐其醫之藥也是醫施已恐之之藥也是無他夫醫不知其察病之規則與治病之方法而欲施已恐之藥也可勝嘆哉嗚呼醫猶且恐之病人豈不恐之乎此天下古今之通病而所以恐巴豆及諸藥者為之故也夫苟有其證而服其藥又何恐之有苟無其證而施其藥則百藥皆可恐焉又何獨巴豆之恐乎品考巴豆帶殼者良是惟一品無有偽品宋王碩曰巴豆不壓油而用之巴豆之功多在於油也王碩者能知巴豆之功者也蜜主治結毒急痛兼助諸藥之毒考證大烏頭煎證曰寒疝繞臍痛烏頭湯證曰歷節不可屈伸疼痛又曰腳氣疼痛不可屈伸又曰寒疝腹中絞痛烏頭桂枝湯證曰寒疝腹中痛以上三方蜜各二升大陷胸丸證曰結胸項亦強上一方白蜜二合大半夏湯證曰嘔吐心上痞硬上一方白蜜一升甘草粉蜜湯證曰心痛上一方蜜四兩下瘀血湯證曰産婦腹痛上一方蜜和為丸酒煎又與諸藥等分之例甘遂半夏湯證不具上一方蜜半升據此諸方則蜜能治諸結毒急迫疼痛明矣最能治腹中痛者故同烏頭用則治寒疝腹痛同甘草用則治心痛急迫同大黃用則治胸腹結痛同甘遂用則治水毒結痛同半夏用則治心胸硬滿由此觀之則蜜能治其急痛而又能助諸藥之毒也故理中丸八味丸栝蔞瞿麥丸半夏麻黃丸赤丸桂枝茯苓丸麻子仁丸礬石丸皂莢丸當歸貝母苦參丸烏頭赤石脂丸上十一方皆蜜和為丸是弗助諸藥之毒耶故如烏頭附子巴豆半夏皂莢大黃皆以蜜和丸則倍其功一層矣是其徵也若或以糊為丸則必減其功之半常試有驗無不然者余故曰蜜能助諸藥之毒矣或云煉過則緩諸病之急不煉則助諸藥之毒豈其然乎哉互考大烏頭煎烏頭湯烏頭桂枝湯條有寒疝及腳氣之名是蓋晉唐以後之人之所加焉疑非仲景之舊矣宜隨其證而施此方耳大陷胸丸證似不具然今按其方此方之於治也毒結於心胸之間項亦強痛如柔痙狀者主之本論但云項亦強強字之下疑脫痛字故大陷胸湯證曰從心下至少腹硬滿而痛不可近者主之又曰心下滿而硬痛者主之湯法已然丸方亦豈無強痛之證乎然則此方亦當從心下至少腹硬滿而痛項背亦強痛者主之比諸湯方其證但緩也耳況有大黃有葶藶有甘遂有杏仁芒硝豈無項背心胸至少腹不強痛乎是蜜之所以補其結毒疼痛也大半夏湯證曰治嘔心下痞硬者雖無急痛結痛之證然其人嘔而心下痞硬則豈無心胸不痛之證乎故和蜜一升於一鬥二升之水而煮之但取蜜與藥汁二升半則是欲多得蜜之力也明矣然則不可謂無所急痛矣甘草粉蜜湯證曰毒藥不止千金翼方毒藥作藥毒為是此方本主緩結毒急痛故兼治一切藥毒不止煩悶者後世見之以為蜜能解百藥毒蜜若解百藥毒則仲景之方何其用蜜之多乎夫蜜之於諸藥也能助其毒又於其病毒也能緩其急猶粳米與小麥乎甘草及粉亦其功大抵相似故如此方則為緩其急用之凡蜜之為物同諸藥用之則能助其毒今同甘草及粉用之則又能緩其急痛也煩悶豈非藥毒之急乎又所以兼治蛔蟲心痛也杶又按所謂藥毒者非攻病毒毒藥之藥毒而必是害人毒藥之藥毒矣故曰藥毒不止煩悶者所謂煩悶者非攻病毒毒藥之煩悶而害人藥毒之煩悶也苟止攻病毒毒藥之煩悶者非疾醫之義矣煩悶是毒藥之瞑眩也豈其止之可乎余故曰此藥毒者非攻病毒毒藥之藥毒矣由此觀之則蜜之功可以知矣害人毒藥者蓋非醫人誤治之毒藥甘遂半夏湯證曰病者脈伏其人欲自利利反快雖利心下續堅滿按此證非此方正證此方蓋芍藥甘草湯證而心下硬滿嘔者主之夫芍藥甘草湯之為方非治疼痛拘攣急迫者乎然則此方亦豈得無治心下硬滿疼痛急迫證矣乎是所以合其蜜半升也堅滿之堅當作硬辨誤本草曰蜜和百藥李時珍曰調和百藥而與甘草同功此二説俱以味之甘故云有調和之功蓋甘草者諸方多用之蜜則不然由是觀之蜜調和百藥之説最可笑矣雖然若謂之治結毒疼痛急迫則謂之與甘草同功亦可也然則蜜有能緩病之急之功也大抵與甘草相似矣彼不知之而謂之調和者所謂隔靴搔癢之類乎哉或曰大烏頭煎烏頭湯烏頭桂枝湯功何在於蜜乎蜜有調和烏頭之意余曰此不知治療之法者言也嘗造此三方去蜜用之未嘗見奏其功如法者況有服之如醉狀者乎故此三方蜜之立功最居多矣蜜煎導之方李時珍曰張仲景治陽明結燥大便不通誠千古神方也本論云陽明病自汗出若發汗小便自利者此為津液內竭也雖硬不可攻之當須自欲大便宜蜜煎導而通之杶按此為以下七字蓋王叔和所攙入也本論多有此句法豈仲景之意乎夫津液內竭與不竭非治之所急也宜隨其證治之故此證本有不可施大黃芒硝者矣今作此方以解大便初頭硬者則當須大便易而燥結之屎與蜜煎導俱煬解必下豈謂之潤燥可乎宜謂之解燥結之屎矣此非蜜之緩病之急之一切乎時珍不知而謂之潤臟腑通三焦調脾胃者最非也凡仲景之為方隨證治之則無一不神方者豈唯此方特千古神方乎哉又按此章當作小便自利者大便必硬不可攻之於是文字穩法證備始得其義品考蜜者本邦關東北國不産但南海鎮西諸州多産之我們不擇崖石土木諸蜜皆生用之不用煉法唯宜漉過王充曰蜜為蜂液食多則令人毒不可不知煉過則無毒矣是王之説為餌食言之若為藥材則平人食之有毒毒乃蜜之能也煉過無毒則同於不用無毒豈得治病毒乎蟅蟲主治乾血故兼治少腹滿痛及婦人經水不利考證下瘀血湯證曰産婦腹痛又曰經水不利上一方蟅蟲二十枚土瓜根散證曰帶下經水不利少腹滿痛經一月再見者又曰陰㿗腫上一方蟅蟲三兩大蟅蟲丸證曰羸瘦腹滿不能飲食內有乾血肌膚甲錯兩目黯黑上一方蟅蟲一升據此三方則蟅蟲能下乾血利經水明矣臍下若有乾血必痛故兼治少腹滿痛也夫經水不利或一月再見者亦以臍下有乾血也乾血者久瘀血也是少腹結毒也可按候之此三方之外仲景無用蟅蟲者大鱉甲煎丸方內雖有蟅蟲其方駁雜無所徵焉今不取互考下瘀血湯證曰産婦腹痛土瓜根散證曰帶下經水不利少腹滿痛又曰經一月再見者上二方皆以蟅蟲為主藥似為婦人血毒設之雖然或云治㿗或云內有乾血肌膚甲錯何必婦人血毒之治乎由此觀之則蟅蟲及此三方不啻治婦人血毒矣雖男子亦可用之但臍下有血毒者婦人最多故仲景嘗立此方法以治婦人之病是其遺法耳凡一身之內有血毒所著者必見肌膚甲錯證若著臍下則有兩目黯黑羸瘦腹滿不能飲食證後世不知此證名曰五勞為爾申約其審聽之曰七傷曰虛勞曰勞瘵皆屬空談理義我們所不取也是以如下瘀血湯亦治男子少腹滿痛小便不利及淋瀝或血自下者此人當必有肌膚甲錯等證又按此方服法曰頓服之新血下如豚肝然亦謂腹中有乾血著臍下則似言相矛盾此方本為乾血而設之今服此方而其血下謂之新血可乎凡用蟅蟲三方皆為治乾血之方蓋乾血乃久瘀血也若治新血不下證則別有桃仁承氣湯大黃牡丹皮湯大黃甘遂湯若治畜血則有抵當湯及丸故治乾血則有此方及土瓜根散大蟅蟲丸是皆以蟅蟲為主藥此為蟅蟲能破久瘀血之用也由此觀之則新血下如豚肝者是蓋畜結之血新下如豚肝色之謂乎土瓜根散證曰經水不利少腹痛經一月再見者下瘀血湯證曰乾血著臍下經水不利者然則經水不利者是乾血所為明矣又曰主陰㿗腫按丈夫陰器連少腹急痛謂之㿗也此證亦瘀血所為也此雖其證不具然據少腹急痛證則自有此方證具矣大蟅蟲丸證曰羸瘦腹滿不能飲食內有乾血肌膚甲錯兩目黯黑此證者乃後世所謂勞瘵五勞七傷是也皆是世醫常談其説屬臆度也但羸瘦腹滿至兩目黯黑其證不可廢也其證不可廢則此方亦不可廢也是必仲景遺方而有所可徵者至五勞虛極及七傷及緩中補虛數證則後人妄添不俟余言矣李時珍本草蟅蟲附方有之大黃蟅蟲丸治産婦腹痛有乾血者用蟅蟲二十枚去足桃仁二十枚大黃二兩為末煉蜜杵和分為四丸每以一丸酒一升煮取二合溫服當下血也張仲景方云云按是下瘀血湯之方而非大黃蟅蟲丸之方也時珍何以稱此方而謂大黃蟅蟲丸乎其文亦大同小異蓋時珍所見金匱要略有別所傳之本乎又本草傳寫之謬誤乎若夫本草之謬則大黃蟅蟲丸下必脫金匱要略五勞以下法語而本草治産婦腹痛條上脫下瘀血湯四字矣乎大觀本草所引蘇頌圖經蠐螬條曰張仲景治雜病方大蟅蟲丸中用蠐螬以其主脅下堅滿也由此觀之則十二味方者名大蟅蟲丸而大字之下無黃字此非大黃蟅蟲丸也又蟅蟲條曰張仲景治雜病方主久瘕積結有大黃蟲蟅丸乃今下瘀血湯也然則本是二方而金匱要略十二味方者蓋古名大蟅蟲丸猶大柴胡湯大承氣湯大青龍湯大半夏湯大建中湯大陷胸湯之大也當須別有小蟅蟲丸之方矣疑今下瘀血湯蓋名大黃蟅蟲丸故以大黃蟅蟲為主藥也且今名下瘀血湯者疑非方之名而當須以下此瘀血之湯主之之意矣乎後之録方者誤脫大黃蟅蟲丸五字而稱之曰下瘀血湯乎又後之揖金匱要略者遂謂之下瘀血湯而名此方者矣猶抵當烏頭桂枝湯救逆湯新加湯類乎況此方是丸方猶抵當丸以水煮之然則此方亦不可名湯也由此觀之下瘀血湯宜稱大黃蟅蟲丸而十二味大黃蟅蟲丸宜稱大蟅蟲丸矣東洞翁嘗謂大黃蟅蟲丸乃十二味之方説非疾醫之言杶謹按翁蓋指五勞虛極及七傷緩中補虛之語乎夫羸瘦腹滿不能飲食內有乾血肌膚甲錯兩目黯黑數語可謂此方之證具矣若按其腹狀而內外諸證診察相應則此方當須奏其功耳明者其謂之何矣鱉甲煎丸方千金方外臺祕要皆作大鱉甲煎丸蘇頌圖經作大鱉甲丸張仲景方云云方內有蟅蟲然非仲景之意疑仲景之時別有鱉甲煎者後世失其方蓋蘇頌所見別方矣東洞翁曰此方唐朝以降之方而非古方故不取焉杶謹按千金方外臺祕要已載之取決非唐朝以降之方矣恐翁未深考之唯蟅蟲之功於此方無所徵矣故不贅於此品考蟅蟲狀似鼠婦而大者寸余形扁如鱉有甲似鱗橫紋八道露目六足皆伏於甲下少有臭氣似蜚蠊本邦未産此物但華舶來一品余嘗多畜而使用之屢得其效虻蟲主治瘀血少腹硬滿兼治發狂瘀熱喜忘及婦人經水不利考證抵當湯證曰少腹硬滿又曰有久瘀血又曰有瘀血上虻蟲三十枚抵當丸證曰少腹滿應小便不利今反利者為有血者上虻蟲二十枚據此二方則虻蟲治瘀血明矣是與水蛭互相為其用故二品等分唯湯方用三十枚丸方用念枚夫湯之證急也丸之證緩也故分兩亦有多少也耳互考淮南子曰虻破積血劉完素曰虻食血而治血因其性而為用也按用虻蟲之方曰破積血曰下血曰畜血曰有久瘀血曰有瘀血曰婦人經水不利下曰為有血曰當下血曰瘀熱在裡曰如狂曰喜忘是皆為血證諦也然不謂一身瘀血也但少腹有瘀血者此物能下之故少腹硬滿或曰少腹滿不問有瘀血否是所以為其證也品考虻蟲夏月多飛食人及牛馬之血小者如蜜蜂大者如小蜩形似蠅大目露出腹凹偏微黃緑色或云水蛭所化間見之山中原野群集然則大者山蛭所化而小者水蛭所化矣俱用之段成式曰南方溪澗多水蛆長寸余色黑夏末變為虻杶按水蛆蓋水蛭之誤蛆蛭字相似阿膠主治諸血證故兼治心煩不得眠者考證芎藭當歸膠艾湯證曰妊娠下血白頭翁加甘草阿膠湯證不具大黃甘遂湯證曰水與血俱結在血室上三方阿膠各二兩黃連阿膠湯證曰心中煩不得臥黃土湯證曰下血吐血衄血上二方阿膠各三兩豬苓湯證曰心煩不得眠上一方阿膠一兩據此諸方則阿膠主治諸血證心煩不得眠者明矣然心煩有數證不得眠亦有數證若無血證則屬他證也故法無血證者皆為脫誤矣互考芎藭當歸膠艾湯證曰婦人有漏下者上一證有半産後因續下血都不絶者上一證有妊娠下血者上一證假令妊娠腹中痛為胞阻上一證按此條古來未得其解余嘗如此段落分裁為四章其義始明其證亦可得治之解曰婦人有漏下腹中痛心煩不得眠者此方主之上第一章婦人有半産後下瘀血都不絶腹中痛心煩或不得眠者此方主之上第二章婦人有妊娠下血腹中痛心煩不得眠或頓僕失跌或胎動不安者此方主之上第三章婦人有妊娠腹中痛漏胞經水時時來心煩不得眠或因房室所勞傷胎者此方主之上第四章以上諸證皆女人妊娠或半産或産後下血而心煩腹痛者此方所宜治也諸證當須有不得眠之候然無血證則非此方所宜也白頭翁加甘草阿膠湯證不具但云産後下利此方豈惟産後下利治之乎凡本方證而下血心煩急迫不得眠者此方主之由此觀之豈惟婦人乎雖男子亦有熱利下重大便血心煩急迫不得眠者則宜用此方夫下重者下利重多也非後世所謂痢病肛門下墜利急後重之謂也蓋利急後重者下利急迫重多也古者便為之後故後重者下重也下重者下利重多也是此方所治也黃連阿膠湯證曰心中煩不得臥蓋此方治下利腹痛大便血心中煩悸不得眠者夫黃芩之於下利黃連之於心中煩悸芍藥之於腹中痛主以治之惟阿膠之於心煩不得眠亦不見血則無所奏其效然則此方治下利腹痛心中煩悸不得眠而見血者明矣若不見血而施此方豈其謂之得其治法乎大黃甘遂湯證曰婦人少腹滿如敦狀小便微難而不渴者是乃此方所主也脈經敦狀作敦敦狀敦音堆敦敦者不移不動之謂也若作敦狀則敦音對器名杶按其此證謂之有血亦非也謂之無血亦非也然謂之小便微難則謂之非血亦非也是所謂因法立略因略取法法略相熟則雖未見其血亦有此證則施此方施此方則血自下血自下而後其證自差故仲景曰其血當下其此可謂之略而已夫略也者不熟其法則不可得此者也生後者此為水與血俱結在血室也此章蓋後人所妄添也生後産後也産後若有前證者此為水與血俱結在血室水血本無二血是指瘀血血室謂其分位義屬想像臆度今不取焉夫水血若有二則仲景何其不謂水與血當下乎今謂其血當下者是水血無二之謂也醫者其思諸豬苓湯證曰脈浮發熱渴欲飲水小便不利者主之又曰少陰病下利六七日咳而嘔渴心煩不得眠者主之夫少陰病者脈微細但欲寐也又曰欲吐不吐心煩但欲寐五六日自利而渴者是雖今見此少陰本證若其人有血證則心煩不能眠也故見其下血而後施此方則未嘗有不差者若不見其血下則雖屢施此方亦未嘗見奏其功者數試數驗不可不知矣辨誤阿膠後世有補血之説然今讀諸家本草其所主治皆是在於治瘀血也凡久年咳嗽赤白痢下下血吐血咯血衄血嘔血老人大便祕結或小便淋瀝及見血婦人經水諸變妊娠之病無不屬瘀血者古方既然後世諸方皆然宜矣今醫見之謂之補血藥雖然以余觀之謂之化血而可也何以言之則阿膠配之豬苓澤瀉滑石則瀉瘀血於小便配之大黃甘遂則下瘀血於大便配之黃芩黃連則除瘀血心中煩者配之甘草黃柏秦皮白頭翁則治瘀血熱利下重者配之當歸芎藭地黃芍藥艾葉則止瘀血腹中㽱痛者配之朮附子黃土則治瘀血惡寒小便不利者由此觀之則豈謂之補血可乎後世皆見其枝葉而不知其根本醫之所以誤治者不亦宜乎品考阿膠以阿縣所制者為名今華舶來之物數品入藥當以黃透如琥珀色為上品或光黑如醫漆不作皮臭者為良若真物難得則此邦皮膠黃透夏月不濕軟者可權用粳米白虎湯白虎加桂枝湯白虎加人參湯上三方粳米各六合附子粳米湯竹葉石膏湯上二方粳米各半升桃花湯上一方粳米一升麥門冬湯上一方粳米三合品考粳者稻之不黏者又名粳羅願曰稻一名稌然有黏不黏者今人以黏為糯不黏為粳辨誤明李春懋曰凡仲景方法用米者皆稻米王叔和改稻米作粳米後世方家仿之不知其是非余曰其是是非非春懋所能知也夫人未嘗知所以仲景方法與病證相對而何得分辨糯粳二米之功乎哉夫稻也者粳糯通稱也稌亦然顏師古刊誤正俗本草綱目掌禹錫所引證本草稻米即今糯米也或通呼粳糯為稻禮記曰稻曰嘉蔬孔子曰食夫稻周官有稻人鄭玄曰以水澤之地種穀也杶按谷者粳糯並稱焉漢有稻田使者是通指糯粳而言所以後人混稱不知稻即糯也顏説非也禹錫亦不知其非也既謂通呼粳糯為稻並通指粳糯而言而又云後人混稱不知稻是即糯也今依此二説而謂漢以上無粳米皆是臆度不足取焉李春懋亦未知此謬矣王叔和改稻米作粳米此説未知出於何書但外臺祕要第五溫瘧病方內引千金論白虎加桂枝湯服度煮法後曰傷寒論云用秕粳米不熟稻米是也今校之千金二方無所見焉古本有此説亦不可知矣我們常依仲景之方而試粳米之功奏其方之效則今粳米即古粳米不俟余辨矣醫者苟用之不別粳糯亦可也殊不知粳糯即是一稻米矣又按肘後方治卒腹痛粳米煮飲之是即附子粳米湯方內用粳米之意葛洪蓋取之乎互考爾雅翼引汜勝之云三月種粳稻四月種秫稻稻若詩書之文自依所用而解之如論語食夫稻則稻是粳月令秫稻必齊則稻是糯周禮牛宜稌則稌是粳詩豐年多黍多稌為酒為醴則稌是糯又稻人職掌稼下地至澤草所生則種之芒種是明稻有芒有不芒者今之粳則有芒至糯則無是得通稱稌稻之明驗也然説文所謂沛國謂稻曰糯至郭氏解雅稌稻乃云今沛國稱稌不知説文亦豈謂此稌訛為糯邪將與郭自異義也杶按許慎東漢人郭璞西晉人許豈有將與郭自異義之理乎蓋許慎之説方言也郭璞之説稌亦稻之屬也近來古方家或惑本草者流之説而偏用今之糯米者非也小麥甘草小麥大棗湯上一方小麥一升大麥消石礬石散上一方用大麥粥汁服之枳實芍藥散上一方用麥粥汁服之以上皆用今大麥粉甘草粉蜜湯上一方粉一兩品考粉粱米粉也千金方解百藥毒篇曰解鳩毒及一切毒藥不止煩滿方乃此甘草粉蜜藥也粉作粱米粉毒藥蓋藥毒顛倒也金匱要略依此又千金翼方作藥毒不止解煩外臺祕要解諸藥草中毒方內引千金翼方療藥毒不止解煩悶今本千金翼方脫悶字又粱米粉作白粱粉白粱乃粱米白者也又有黃粱故今作白粱者所以別於黃粱也二書又俱毒藥作藥毒由是觀之粉是粱米粉而毒藥是藥毒明矣正字通曰凡物磑之如屑者皆名粉粉為通稱非獨米也故粉有豆屑米粉又有輕粉胡粉鉛粉白粉之名則如此藥方亦不可單稱粉矣然則二書作粱米粉者為正況復金匱要略成於趙宋固多脫誤蓋脫粱米二字明矣千金翼方外臺祕要成於李唐但有訛謬耳今宜從三書作粱米粉試之得有應驗矣辨誤凡粉米粉也釋名曰粉分也研米使分散也夫米者謂諸米説文米粟實也爾雅翼曰古不以粟為谷之名但米之有浮谷者皆稱粟然則米是粟實之稱也説文粉傅面者也韻會云古傅面亦用米粉又染之為紅粉杶按米者九穀六米之米也周禮地官舍人掌粟米之出入注九穀六米者九穀之中黍稷稻粱苽大豆六者皆有米麻與小豆小麥三者無米故云九穀六米然則粉是六米粉明矣不必俟余辨故宜呼稻米粉黍米粉稷米粉梁米粉矣無單稱粉之義也尚書益稷粉米之粉別有其義可考或曰甘草粉蜜湯之粉胡粉也李彬之説胡粉有毒能殺蟲本草曰殺三蟲陶弘景曰療尸蟲陳藏器曰殺蟲而止痢也由此諸説則非胡粉能治蟲乎然則粉必胡粉而似非米粉也事物記原輕粉條曰實録曰蕭史與秦繆公練飛雲丹第一轉與弄玉塗之名曰粉即輕粉也此蓋其始也實録乃三儀實録也是燒其水銀者也又胡粉條曰墨子曰禹作粉張華博物志曰紂燒鉛作粉謂之胡粉續事始曰鉛粉即所造也杶按鉛粉蓋粉鉛之誤上二説雖出實録蓋諸家雜説而非事實也飛雲丹之説涉怪誕矣或曰粉鉛粉或曰粉輕粉雖然古書單稱粉者多是米粉也益稷曰粉米蓋指其形狀周禮人職曰粉餐況復從米分聲則皆似指六米也胡粉輕粉以其物似米粉而得粉名矣然則粉非胡粉輕粉明矣凡方書曰胡粉曰粉粉曰數值未嘗見單呼粉者今唯甘草粉蜜湯一方金匱謂之粉與蜜方名亦謂之粉蜜湯故後世醫者惑焉或曰胡粉或曰輕粉或曰稻米粉殊不知千金方及翼方外臺祕要既謂之粱米粉豈可不取徵於三書乎今略謂之粉蜜湯者猶桂枝加桂湯之桂耶況復試之粱米粉最有效矣由是觀之金匱方內脫粱米二字明矣天下醫者惑則其證不治可嘆乎哉赤小豆瓜蒂散上一方赤小豆一分赤小豆當歸散上一方赤小豆三升上二方之外用赤小豆之方皆非仲景之意今不取焉膠飴大建中湯小建中湯黃耆建中湯上三方膠飴各一升主治膠飴之功蓋似甘草及蜜故能緩諸急考證小建中湯證曰腹中急痛又曰裡急又曰婦人腹中痛大建中湯證曰上下痛而不可觸近黃耆建中湯證曰裡急依此三方則膠飴能治裡急夫腹中急痛腹中痛豈非裡急矣乎余故曰膠飴之功與甘草及蜜相似矣酒八味丸土瓜根散赤丸天雄散上三方各酒服之下瘀血湯上一方酒煮之品考中華造酒與本邦造法不同然試其功又無所異矣凡單呼酒者皆用無灰清酒醇酒美清酒同麻黃醇酒湯上一方美清酒五升品考醇酒乃美清酒故云以美清酒煮漢書師古注醇酒不澆謂厚酒也按厚酒者酒之美者也故曰美清酒清酒當歸芎藭膠艾湯上一方水酒合煮品考李時珍引飲膳標食題云酒之清者曰釀説文釀醞也然則清酒宜用平常所飲無灰清酒也法醋大豬膽汁導法上一方品考法醋無所考蓋如法造釀之醋矣乎成本無法字苦酒苦酒湯黃耆芍藥桂枝苦酒湯上二方上方無升合下方一升品考陶弘景曰醋亦謂之醯以有苦味俗呼苦酒由此説則苦酒是俗稱蘇恭曰醋有數種惟米醋二三年者入藥杶按此米者是稻米釋名曰苦酒醇毒甚者酢苦也本邦所造皆米醋甚釅今用之有功其人必心煩不止故黃耆芍藥桂枝苦酒湯法曰溫服一升當心煩若心煩不止者以苦酒阻故也阻者蓋惡阻之阻也用之必有心煩不止者是其阻也美酒醯黃耆芍藥桂枝苦酒湯法後曰一方用美酒醯代苦酒然則美酒醯者蓋以美酒所造之醋矣酢醋本謂之醯也故周禮有醯人職可考白酒栝蔞薤白白酒湯上一方白酒七升栝蔞薤白半夏湯上一方白酒一斗品考周禮酒正職辨四飲之物三曰漿鄭玄曰漿今之酨漿也陸德明音義昨再反疏云此漿亦是酒類故字亦從酉省酨之言載米汁相載漢時名為酨漿許慎説文漿字注云漿酢漿也本作酨省聲今作漿又酨字注云酨酢漿也從酉載聲博雅云酨漿也師古亦云酨漿也禮記內則曰漿水酨濫鄭玄注漿字曰酢酨按或曰酨漿或曰酢漿或曰白皆是酒正所造之漿也千金方白酒作白酨漿或作白酨酒外臺祕要亦同但指此方內白酒矣夫謂之酒者造釀之法大抵與酒同又以酒正所掌故謂之白酒或謂之白酨酒蓋白酒者白酨酒略稱矣李時珍本草綱目地水類載漿水釋名謂之酸漿兵部手集謂之酸漿水産寶亦同時珍今不載白酒酨漿白酨酒白酨漿者蓋屬脫誤矣但薤白附方引仲景栝蔞薤白白酒湯又引千金方栝蔞湯即仲景栝蔞薤白半夏湯白酒作白酨漿雖有白酒白酨漿之名然本部不載之者彼人未得知仲景用白酒之意也彼是一草醫但好本草家之言者也不足深責之唯注酨字曰酨音在酸漿也是知酨之為酸漿而不知漿水之為白酒也杶按白酒乃大觀本草玉石部漿水是也周禮酒正職漿明矣然則白酨漿白酨酒白酒及酨漿漿酨酢漿酸漿酨酒皆是漿之別名略稱也造法詳出於陳嘉模本草蒙筌時珍亦取嘉模之法雖然其造法不悉具疑有脫誤矣近比問諸華客汪繩武曰白酒即白酨漿原米之濃汁以一倍之汁加三倍之水衝入作為白酒矣造法用糯米浸一宿蒸熟候溫以白色曲末拌入缸內用稻草護暖三日後成漿入水即成酒氣味甘苦十月間做者名曰十月白尤佳也今按此造法與我邦呼為甜酒者同法或一夜而熟者呼雞鳴甜酒或二三日而成者謂之醴酒也造法大抵相似嗚呼韃清姦商所言不足信焉今唯存以備博物者一事云爾辨誤仲景之方始有白酒之名晉唐以後諸子方書及諸家本草未嘗有説白酒之功者何哉晉唐醫人未知此物之功乎諸家本草何其略之乎又可疑耳但李時珍本草所引子母祕録有栝蔞白酒治乳癰之方此外又無所見焉余嘗謂仲景氏之方法者自王叔和撰次之後歷隋唐至宋明而無有一人全執之者如何則我今以其藥物與病證知之曰何以知之乎曰夫仲景嘗用蟅蟲而諸家醫書未嘗見用其方者仲景嘗用白酨酒而諸家本草未嘗論及此物仲景嘗治婦人臟躁有甘草小麥大棗湯而古今諸家未嘗知其證之治法則不能用此方仲景嘗治胸痹有白酨酒二湯而天下醫者未嘗知胸痹證候則不能用白酨酒二方然則二千年來不能全執仲景方法也我今於是乎知之鳴呼吾黨小子幸依東洞翁之德而得全執仲景方法豈可不謂天之寵靈乎哉夫白酨酒之功之湮滅也久乎哉諸家本草唯載漿水於水部而不知為造釀之物故不載之造釀部而載之地水部大觀本草又誤載之玉石部亦可笑哉漿水與酒酢實為造釀物矣若其以地水造之而載之水部則酒酢亦當載之水部蓋本草之謬往往如此考證栝蔞薤白白酒湯證曰胸痹之病喘息咳唾胸背痛短氣栝蔞薤白半夏湯證曰胸痹不得臥心痛徹痛因此二方之證則白酒能治胸背及心痛煩悶夫前方之證輕而後方之證重其義如何則凡胸痹之為病喘息咳唾胸背痛短氣是也今其痛甚而心痛徹背則其證為重故前方者白酒七升而後方為一斗其以此分別其輕重而已漿水礬石湯上一方漿水煮之蜀漆散半夏乾薑散赤小豆當歸散上三方漿水服之清漿水枳實梔子豉湯上一方以清漿水煮之品考漿水清漿水二品俱與白酒同物清漿蓋取其清者辨誤古今醫人不知白酒白酨漿白酨酒漿水皆為同物遂無一人解其品物者是不能手自使用仲景之方也可勝嘆乎凡仲景之方非仲景所自制之方也蓋撰用古人之成方而取其純粹者也故如附子烏頭天雄本是同根一物而或曰附子湯或曰烏頭煎或曰天雄散是仲景取古人各各所稱之方以不改其名而使用之者也是以此一漿而或謂白酒或謂漿水或謂清漿水如彼醯酢苦酒亦然皆因古人所稱而唯取其方治而已無復異論醫者其思諸白飲牡蠣澤瀉散五苓散半夏散上三方皆白飲服之其餘皆云飲服品考白飲蓋白湯或云無所考辨誤凡曰飲曰白飲蓋一物矣然此三方但謂白飲服之者必有所異乎然金匱要略茵陳五苓散服法曰先食飲方寸匕者蓋飲字上脫白字飲字下脫和服二字外臺祕要可考若夫飲者是四飲六飲之飲則周禮酒正有清醫漿酏膳夫職有六清水漿醴䣼醫酏乃六飲也而飲皆寒飲故食醫職曰飲齊視冬時注曰飲宜寒由此諸説則單稱飲者及稱白飲者豈此四飲六飲之謂矣乎又膳夫職食飲注曰食飯也飲酒漿也則是又單稱飲者恐酒漿二物之謂乎雖然如此散方豈以酒漿二物而互服之乎又按飲及白飲疑俱是白酒之謂歟又謂之白湯亦無所徵焉俟他日考訂飲葵子茯苓散豬苓散栝蔞瞿麥丸半夏麻黃丸乾薑人參半夏丸排膿散麻子仁丸防己椒目葶藶大黃丸桔梗白散蒲灰散滑石白魚散蜘蛛散當歸貝母苦參丸上十三方皆謂飲服三國志華他傳曰便飲麻沸散須臾便如醉死然則飲者乃服散之義乎又湯水飲散之謂乎考見上暖水五苓散服法暖水蓋溫暖之湯矣辨誤五苓散服法曰白飲服之或云白飲是白湯白湯是熱湯熱湯是暖水若其説是則何謂服以白湯助以暖水乎按白湯是熱湯之謂而暖水是溫暖之湯矣殊不知一湯而分以二名乎哉沸湯文蛤散上一方以沸湯服之麻沸湯大黃黃連瀉心湯附子瀉心湯上二方以麻沸湯漬之品考沸湯麻沸湯並是熱湯出於本草綱目雞子白苦酒湯上一方雞子黃排膿散黃連阿膠湯上二方雞屎白雞屎白散上一方馬通汁柏葉湯上一方品考大觀本草云屎名馬通按屎即白馬屎絞取其汁故曰馬通汁豬膏豬膏發煎上一方豬脂雄黃葶藶方上一方品考豬膏豬脂本是一物説文曰戴角者脂無角者膏是但注其字耳內則曰脂用蔥膏用薤鄭玄曰脂肥凝者釋名曰膏則豬脂豬膏者宜以凝釋分之豬膚豬膚湯上一方品考禮運曰膚革充盈疏云膚是革外之薄皮革是膚內之厚皮然則豬膚者豬之外膚也豬膽大豬膽汁導法白通加豬膽汁湯四逆加豬膽汁湯上三方品考仲景之用豬膽唯三方皆用其汁是乃生豬膽汁也非以乾者為汁用之本邦不畜豬無所得其生豬膽矣庶以干豬膽為汁用之亦可乎獺肝獺肝散上一方品考獺乃水獺羊膽四逆加豬膽汁湯上一方方後云如無豬膽以羊膽代之羊肉當歸生薑羊肉湯上一方蜘蛛蜘蛛散上一方品考羅願曰蜘蛛布網於簷四隅狀如罾自處其中飛蟲有觸網者輒以足頓網使不得解乃此物也其餘不入藥蠐螬大蟅蟲丸上一方品考邢昺曰在糞土者名蠐螬陳藏器曰蠐螬身短足長背有毛節入秋化為蟬是白魚滑石白魚散上一方品考東洞翁曰白魚即白鯉魚李時珍引劉干曰白魚生江湖中色白頭昂大者長六七尺按史記周紀白魚躍入於王舟者即此物互考大觀本草云白魚甘平無毒主去水氣大者六七尺色白頭昂生江湖中是乃開寶甘草宋馬志之説也然白魚之名出於周紀由來久矣廣韻鱎字注云鱎居夭切集韻舉夭切音矯白魚別名李時珍云白魚釋名鱎魚音喬白亦作鮁白者色也魚者頭尾向上也鮁唐韻旁陌切音白博雅鮁鱎也字書皆以為鱎説苑宓子賤陽橋魚之橋説苑及爾雅翼等皆作橋梁之橋字書何以改橋為鱎從魚乎陽橋本魯地名橋鱎竺音喬夫以所生陽橋之水之魚名鱎乎未知何是説文韻會俱無鱎字玉篇鱎奇兆切白魚也字書蓋由玉篇以為陽橋魚之鱎乎若由説苑陽晝之言則此白魚者其為魚薄而不美者歟由此觀之白魚之名本出於周紀躍入於王舟者豈指衣書中白魚乎李時珍曰形窄腹扁鱗細頭尾俱向上肉中有細刺武王白魚入舟即此我肥藩江河中有此物其形大抵似鯉曰白鯉魚其味薄而不甚美能利水愈腫用之有效漁人取而棄之又非鯉類疑此物真白魚矣乎俟後日試效衣中白魚爾雅釋蟲蟫白魚郭璞注今衣書中蟲一名蛃魚別録及圖經千金翼方亦同千金方外臺祕要或曰衣中白魚或曰書中白魚又單稱白魚雖然本經未嘗以白魚為本名則古方所謂白魚者是必魚部白魚非衣書中白魚矣況又蟲而得魚名者以其形稍似魚其尾又分二歧故得蟫及蛃魚壁魚蠹魚之名雖然但不可單以白魚為本稱也後之用此者能治小便不利則益以衣中白魚為古方白魚矣滑石白魚散證曰小便不利此方本載於金匱要略小便利淋篇內則蓋淋家小便不利者主之本草衣魚主治小便不利別録療淋附方又載此方主治小便不通然則諸家皆以衣魚為白魚明矣雖然此方內白魚未可知衣中白魚否並存此二物以俟後之考訂試效辨誤凡藥方內有不以本名稱而以異名呼之者不欲使人知其物也是皆後世醫家之陋也獨仲景之方無以異名稱之者如彼烏頭附子天雄則以其年數形狀稱之如彼芒硝硝石朴硝則以其制之精粗功之緩急取之如彼白酨酒漿水則以諸家所稱之名呼之或以諸家所傳之方録之蓋無異義按仲景撰用諸家之方未嘗變其方名依其所稱而取之耳然則如此白魚散當須依其本名矣由是觀之白魚者蓋非衣中白魚明矣明者其審諸文蛤文蛤湯文蛤散上二方文蛤各五合考證文蛤湯證曰渴欲得水而貪飲者文蛤散證曰意欲飲水反不渴者又曰渴欲飲水不止者據此二方證則文蛤者不問渴不渴能治意欲飲水者品考唐本草注曰文蛤大者圓三寸小者圓五六分非海蛤之類也杶按圓字疑圍字之誤矣蜀木圖經云背上斑文者三月中旬採陳藏器曰文蛤未爛時殼猶有文者杶又按蛤蜊之小而有紫斑者是也雄黃雄黃熏方疳蟲蝕齒方上二方品考凡雄黃者以雞冠色瑩英者為上品諸家本草可考礬石礬石丸硝石礬石散礬石湯上三方品考礬石白而瑩淨明亮者為上品一種自然生者如柳絮名柳絮礬為最上品我藩阿蘇山垂玉溫泉多産此物戎鹽茯苓戎鹽湯上一方品考戎鹽即青鹽説詳於諸家本草可考辨誤李時珍本草附方引此方曰小便不通戎鹽湯用戎鹽彈丸大一枚茯苓半斤白朮二兩水煎服之仲景金匱方云云按金匱要略作小便不利夫不利與不通其證不同不利者雖少少利之亦不快利之謂也不通者決不通利之謂也即小便閉是也故仲景於此方謂之不利而不謂之不通也今考其病證有所不同者又戎鹽湯上脫茯苓二字唯分兩不異而已至謂水煎服之則略其煮法何其疏漏乎又云仲景金匱方夫時珍之取仲景之方往往如此或云張仲景金匱要略或云金匱玉函方引其書各亦不一定録其煮法不多略之至如略引其書則無害於治今録其煮法服度則恆醫苟取其法以施之病人豈惟不無益其病而大害於其治矣時珍之作本草也其疏漏亦往往如此況至於品目其庶物亦自有闕略失其真者天下醫人何其心醉彼人矣乎雲母蜀漆散上一方禹餘糧赤石脂禹餘糧湯上一方辨誤宋版傷寒論赤石脂禹餘糧湯方曰太一禹餘糧此方宜用禹餘糧也太一二字後人妄添説詳於諸家本草代赭石旋覆花代赭石湯上一方品考赭石本出於代州者為上品故得代赭石名猶蜀椒川芎若得赤絳青色如雞冠有澤者宜供治材不必代州之物矣真朱赤丸上一方此方內真朱為色故得赤丸之名品考真朱者即丹砂丹砂即硃砂也陶弘景曰作末名真朱即今辰砂也凡以辰州物為良故得辰砂之名猶代赭石矣辨誤和醫多不分硃砂與銀硃並呼為辰砂往往用之大誤病人銀硃本出於水銀最有毒可不辨乎哉黃丹柴胡加龍骨牡蠣湯上一方品考黃丹即鉛丹白粉蛇床子散豬膚湯上二方品考白粉即鉛粉今胡粉也釋名曰胡粉胡糊也脂和以塗面本草粉錫條可考黃土黃土湯上一方品考黃土即灶中黃土苦參當歸貝母苦參丸三物黃芩湯上二方狼牙狼牙湯烏頭赤石脂丸上二方品考狼牙即本草草部狼牙草辨誤後世以狼獸之牙充之者非也豈有以狼獸牙汁瀝陰中之瘡之理乎蒲灰蒲灰散上一方品考蒲灰諸家本草無所見焉是蓋香蒲草機上織成者別録方家燒用是也李時珍本草蒲席附方載此方葦莖葦莖湯上一方品考葦莖乃蘆葦之莖去葉者也外臺祕要作銼葦又引仲景傷寒論云葦葉切一升然則莖葉俱用之知母白虎湯白虎加人參湯白虎加桂枝湯酸棗湯上四方主治煩熱考證白虎湯證曰表有熱又曰里有熱白虎加人參湯證曰大煩渴又曰表裡俱熱舌上乾燥而煩又曰發熱又曰身熱而渴酸棗湯證曰虛煩今由此諸證則知母能治煩熱麥門冬麥門冬湯竹葉石膏湯上二方蛇床子蛇床子散上一方麻子仁麻子仁丸上一方品考麻子仁疑非今大麻火麻之類別有考不贅於此土瓜根土瓜根散土瓜根導法上二方辨誤土瓜根散脈經作王瓜根散本草或云土瓜或云王瓜禮記月令作王瓜生呂氏春秋作王善淮南子亦作王瓜則土字蓋王字之訛也宜呼王瓜根散品考王瓜其殼徑寸長二寸許上圓下尖秋冬間熟紅赤色子如螳螂頭者是也干蘇葉半夏厚朴湯上一方蔥白白通湯白通加豬膽汁湯上二方敗醬薏苡附子敗醬散上一方品考敗醬後世或以白花者為真物然今以黃花者試之有效故我門不取白花者瓜子大黃牡丹湯上一方品考瓜子用甜瓜子仁今或權用冬瓜子瓜瓣葦莖湯上一方品考瓜瓣乃瓜瓤説文瓣瓜中實也蕘花小青龍湯加減法內有蕘花本方無所用之瞿麥栝蔞瞿麥丸上一方薯蕷八味丸栝蔞瞿麥丸上二方商陸牡蠣澤瀉散上一方海藻同上上一方葵子葵子茯苓散上一方品考凡方稱葵子者即冬葵子乾漆蟅蟲丸上一方皂莢桂枝去芍藥加皂莢湯皂莢丸上二方蜀椒大建中湯烏梅丸上二方椒目防己椒目藶葶大黃丸上一方烏梅烏梅丸上一方秦皮白頭翁湯白頭翁加甘草阿膠湯上二方蘖皮白頭翁湯白頭翁加甘草阿膠湯梔子蘖皮湯上三方山茱萸八味丸上一方柏葉柏葉丸上一方品考凡藥方內稱柏葉者皆用今側柏葉竹葉竹葉石膏湯上一方品考凡方內稱竹葉者用淡竹葉也諸竹亦可補其闕竹茹橘皮竹茹湯上一方品考凡方內稱竹茹者用淡竹之茹若無則諸竹亦可權用亂髮豬膏發煎滑石白魚散上二方人尿白通加豬膽汁湯上一方上七十又八品仲景一二方劑俱使用之故無所取其徵者如彼粳米之於白虎湯附子粳米湯竹葉石膏湯麥門冬湯七證也小麥之於甘草小麥大棗湯證也赤小豆之於瓜蒂散證也膠飴之於大小建中湯二證也雞子白之於苦酒湯證也礬石之於礬石丸硝石礬石散礬石湯三證也土瓜根之於土瓜根散證也干蘇葉之於半夏厚朴湯證也瓜子瓜瓣之於大黃牡丹皮湯葦莖湯二證也皂莢之於皂莢丸桂枝去芍藥加皂莢湯二證也蜀椒之於大建中湯證也秦皮白頭翁蘖皮之於白頭翁湯二方證也山茱萸又薯蕷之於八味丸證也是所以其日用試效者也雖然皆在於成方妙用如何而已不必在於取一味一味之功則又無所以取其徵者故東洞翁於此七十餘品蓋闕如但粳米之於方也凡七首此物之於民食也其美與錦比焉其功亦所以最大者故又治其疾病亦多其功而本草不載此物者何哉惟陶弘景別録始載粳米治病之功曰益氣止煩止渴止泄不過此四功也蓋仲景之用粳米也白虎湯三方證曰大煩渴或曰舌上乾燥而煩欲飲水數升或曰口燥渴或曰渴欲飲水口乾舌燥或曰熱骨節疼煩竹葉石膏湯證曰逆欲吐麥門冬湯證曰大逆上氣大逆者上逆也上逆則必煩渴煩渴則舌上必乾燥是粳米有止煩止渴之功也桃花湯證曰下利又曰下利不止附子粳米湯又能治腹痛下利是粳米有止泄之功也故陶弘景嘗見此數方之證以為粳米止煩止渴止泄也益氣者是道家言非疾醫之事矣近世稱古方家者以為民生常食之物安能治彼病毒矣乎是未知粳米之功取徵於此七方也夫粳米若作穀食則實為氓民生命作之藥物則又足以為治病大材猶生薑大棗作之菜果則足以養性作之藥物則大有力於治病毒也雖然仲景之用粳米也有其主治未可悉知者唯存而不論亦可也肘後方有粳米一味治猝腹痛之方由此觀之又附子粳米湯之治腹中雷鳴切痛桃花湯之治下利腹痛亦似偏取粳米之功矣猶小麥之治急也如彼白酨酒則中華人家常所造釀者也經日易損故不能久藏蓄之我邦飲物未嘗用白酨酒矣故無敢造釀者假令醫家雖欲常藏蓄之未能每每釀之則豈得備於不虞矣乎苟亦每每造釀之不堪其費之多也故若遇胸痹之病則白酨其何所取之是我古方家之所嘆也嗚呼皇和與中華土宜之所然也我其無如之何而已此外若有往往試之者俟他日之論定考徵云爾安永戍初夏十二日
