body:
  text: 附言十七則仲景之方之有徵也藥亦有徵東洞先師嘗有藥徵之舉大行於海內始開天下古今之人之眼目非如後世諸家本草之書之墨墨也嗚呼天下古今何其諸家本草之書之墨墨也是實耳聽之而目不視之者之言也墨墨亦宜乎哉故其書之夥多也雖汗牛充棟亦何徵之有是其所以為墨墨也古者本草之書之出也陰陽服餌之言也陶弘景羽之鏃之深入天下古今之醫之肺腑陶實為之嚆矢矣夫晉唐以降之為醫也蓋以二家之言別立醫之方法者也故其為方法也不之服餌家則之陰陽家又何醫治之有仲景之方法於是乎亡又何徵之為嗚呼藥之有徵也二千年來始有先師之舉嗚呼天下古今別有其人乎晉唐以降之方之存也有若肘後方有若千金方有若外臺祕要其方垂數千今欲取之而徵之於其法無一可徵之於其法之方何其無一可徵之於其法之方耶無藥之可徵之於其證之方也無藥之可徵之於其證之方則無方之可對之於其證之法也方之不對於其證也病何以治哉苟施其方而謂之治者非偶中則病自愈之時與毒自靜之時也醫人其著眼於此則疾醫之道明明察察王叔和嘗撰次仲景之書云未知其是否蓋所謂撰也者撰擇仲景之方法於己之臆度者也所謂次也者相次自家之方法於仲景之書者也是傷寒雜病論之所以攙入附會也隋唐之醫之所以不能辨別分析焉也葛洪之作肘後方也孫思邈之著千金方也王燾之輯外臺祕要也皆不知取之於仲景氏而取之於叔矣氏傷寒雜病論之不顯也職是之由天下之為醫者知視仲景氏之方法於三子者之書而未嘗能知視仲景氏之真面目於傷寒雜病論尚乎哉至趙宋之時藏一本於御府天下之為醫者未嘗能知有仲景氏之方法矣故未嘗能知仲景氏之為何等者當此時天下之為醫者知仲景氏之言之一二有存焉而未嘗能知仲景氏之方法之全然有存焉又未嘗能知仲景氏之醫之為古之疾醫之遺矣又當此時天下之為醫者別立醫道於己之臆度是汗牛充棟之書之所以起也嗚呼當仲景氏之書之不顯之時而別立醫道云者則不得不取之於己之臆度矣至開寶治平之際而仲景氏之書之再出也摹印雕版頒行天下於是天下之為醫者雖知有仲景氏之方法視仲景氏之書亦猶己之臆度之醫道矣我今於林之校正成之注解乎見之於是仲景氏之方法之與趙宋氏之醫道者混淆焉涇渭不分淄澠不辨遂至今之醫流矣聖人既沒大道乖矣七十子已死大道裂矣當春秋戰國之際聖人之大道與天下國家共分崩離析矣豈得不命與數矣乎嗚呼聖人之大道猶且然況於小道醫之為術乎世之無聖人也久矣我無所取於正矣嗚呼我不能取正於聖人之道則我其不可不取徵於聖人之言苟不取徵於聖人之言則言皆不得不取之於己之臆度事亦然於是乎聖人之道將墜於地矣醫之為道亦然苟不取徵於仲景氏之言則言皆不得不取之於己之臆度事亦然夫言也者法也事也者方也素問九靈之説醫也理也本草之説治也妄也妄之與理君子不依故彼書之説醫也其謂之存炎黃氏之遺於十之一二則可也謂之炎黃氏之道則惑也故如彼書又無有方法之可言則後世之有方法也苟不取之於妄之與惑則不得不取之於己之臆度矣仲景氏沒後天下古今之為醫者滔滔皆是所謂晉後之醫者偽統乎哉故先師獨取徵於仲景氏之方法以開二千年來眼目者也嗚呼藥徵之為書不亦偉乎先師者非文儒之徒也故其著書也不為修辭不為文章其意唯在於辨古人之妄釋今人之惑而已故言皆繫於事實先師嘗謂參互而考之次之以古今誤其藥功者引古訓而辨之是以先師之為藥徵也仲景之方取徵於仲景之法仲景之法取徵於仲景之藥方法之與藥無一所違戾者余故曰言皆繫於事實何其修辭文章之為世醫之詆斥先師也以文章修辭者抑末今余之於此編亦然余也性實拙於文辭取笑於大方亦所不辭也余之為醫也陋且拙也豈足奉東洞先師之教以修仲景氏之術乎雖然余也從事斯方三十有餘年於茲矣余之為醫也陋且拙亦豈無所不熟十之一二乎哉余也自嘗修仲景氏之術不加減於方不出入於藥唯隨其證而治之耳嗚呼余之為醫也陋且拙亦豈無所不愈十之一二乎哉如余但奉先師之教以建方之極取藥之徵者也故今所徵於此之藥者是皆所徵於日用之病者也夫今之為醫者不然不自憚之甚妄意加減於方出入於藥寧知方法之有規則乎哉是余之所畏也東洞先師常用所徵本編之藥凡五十有三品余亦於此品而所以徵之得其徵者也無復異論矣先師之言至矣盡矣吾豈有所容喙哉今此編所載十品附録七十有八品十品者常用之物而本編所不載也是乃余之常用所徵而所得其功效者也是所以私竊補先師之遺也又未嘗取之於己之臆度而所以徵之於日用之事實試之於日用之證候者也嗚呼如此數品先師豈有所不徵乎蓋未終之而沒者也噫可惜乎哉余之補之有所大憚於先師者世之君子其謂之何哉雖然余也其不言之孰又言之余也死矣此言已矣嗚呼余之補之唯不免狗尾續貂之誚是懼續編十品先師日用所施之物也本編不載其功之與徵者何也是前所謂蓋未終之而沒者也惟蜀漆之助牡蠣龍骨而治動之劇也蜜之緩諸病之急而助諸藥之毒也是余之所常試而古今醫人所未嘗言及者也余之執斯方三十年之尚矣豈無一二之所得矣乎明者其試諸蟅之為蟲我邦未産此物二十年前余再遊於先師之門先師出一頭示余余又得一二於直海元周之所余遂贈之先師先師喜而藏之然則先師未嘗得試蟅蟲之功效矣爾後余多得之於是余先試之內人之病而有效焉後又試之於他人之病而有效焉此時先師既沒噫我邦試蟅蟲之功者余於先師之門為之先登故今著之粉之為物趙宋以來未嘗得其的實之品故醫者誤治甘草粉蜜湯證者不為不少余今訂之諸書而始得其真物又始得治其證矣白酨酒之治胸痹之病也唐宋以後諸書所不載也余又訂之而得其造釀之法矣胸痹之病其自此有治乎哉先師嘗謂余曰吾自唱古疾醫之道數十年於今矣遊我門之士不下數百人雖然有傳方之人而無傳道之人也吾子其勉旃余自辭先師二十年於茲矣余嘗知受業於東洞之孰者亦不下數十人余又見其人無一人不口先師之醫者然未嘗聞有得先師本旨者若有其人亦或有專長於下劑者或有純執家孰方者或有二三執仲景之方七八取唐宋之方者或有取己之臆負東洞之教者或有學無其力業無其術稱古今並執者其次者或有一端稱奉東洞之教終行後世之方者或有謂東洞之教偏於古而不知今者或有謂東洞之術便於痼疾而不宜於平病者如此抑末不足以挂以齒牙矣夫以我藩推之海內皆是矣乎以余之所見推之余之所未見亦然矣乎是余之所長大息也要之是皆雖曰奉東洞之教亦不能實讀仲景之書者也可勝嘆哉嗚呼仲景之方法者執之知之則不能不為之不能不為之者知之者也不能為之者不知之者也先師沒後仲景氏之方法熄矣是余之所以勤勉勞劬者也仲景之書者古之疾醫之遺也天下古今知之者鮮矣其不知之故人人有異説或有以素靈解仲景之書者或有以晉唐醫學説仲景之書者近世或有以名與數解仲景之書者或有取己之臆辨仲景之書者要之是又不知仲景真面目者也苟欲知仲景真面目請在達於仲景方法而後施之於今日日用事實而已矣余嘗為門徒講傷寒論聽者百餘人余之講傷寒論也一一取徵於仲景之規則一一取徵於仲景之方一一取徵於仲景之法一一取徵於六經史子一一取徵於兩漢以上之書一一取徵於某書某篇某人某言以示其事實余於是謂門徒曰仲景氏方法者古之疾醫之遺也苟不經聖人制作之手安能有此方法乎哉故其道也正其方也正其法也正其術也正無所不正者其不正者有之此為後人攙入今之為醫者不然不知執仲景氏之方法之正不知學仲景氏之治術不正此反正之徒也今其取反正之方法治術以奉此於君之與親者不忠之臣也不孝之子也噫己不啻不忠不孝而使人之臣子不忠不孝者其謂之何哉醫者其思諸先師之作藥徵也改稿凡七余嘗得寶曆之本是也二十年前齋遊於京師因請正於先師先師謂余曰此本實屬草稿為門人所竊去者也正本今在於紀州雖然是亦余之所草也吾子宜見大體豈在於文字章句之間乎哉攜而西歸後又得安永之本修夫氏定正之本也余又別有定本以余之所聞於先師訂之天明五年乙巳之夏京師有上木之役余之定本不敢出之續編及附録定正考索十易裘葛安永戊戌初夏始脫其稿雖不能得先師訂正亦因剞劂氏之請遂謀上梓之事刻成其後也悔矣天明七年丁未初冬十二日村井杶大年識
