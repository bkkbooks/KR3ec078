body:
  text: 卷上赤石脂主治水毒下利故兼治便膿血考證桃花湯證曰下利便膿血赤石脂禹餘糧湯證曰下利不止上二方赤石脂各一斤烏頭赤石脂丸證不具上一方赤石脂一兩據此三方則赤石脂治水毒下利不止便膿血明矣互考赤石脂配乾薑則治腹痛下利若無腹痛則不配乾薑烏頭赤石脂丸證不具但云治心痛徹背背痛徹心者雖然此方豈惟治心背徹痛乎後世誤載之金匱要略心痛病篇內故世醫皆以為但治心痛之方也杶按此方本當在六經病篇內某證條下而治心痛徹背背痛徹心者矣今詳前後之條及病證方法蓋厥陰病蛔厥心痛徹背背痛徹心下利惡寒者主之當是同甘草粉蜜湯大建中湯等在烏梅丸之前後矣外臺秘要第七心背徹痛方內曰仲景傷寒論心痛徹背背痛徹心烏頭赤石脂丸主之小注云出第十五卷中然則是本傷寒論蒸陰病篇內方而必有前後之證存矣何以言之則蜀椒治蛔厥乾薑治下利腹痛烏頭附子並治四肢厥逆赤石脂惟治下利由此觀之此方豈惟治心背徹痛乎余嘗疑烏梅能治蛔故蛔厥心痛徹背背痛徹心則此方不可無烏梅矣然則烏頭是烏梅之誤矣乎凡仲景之方無烏頭附子並用者則益知烏頭是烏梅之誤矣杶又按外臺秘要第七久心痛方內有範汪療久心痛方又名烏頭赤石脂丸方內有桂心桂心即桂枝唐方皆以桂枝為桂心無附子此為異耳或疑附子是桂枝之誤矣乎桂枝能治上衝而厥者烏頭附子本同物同功並存以俟明者試效而已桃花湯方曰赤石脂一斤一半全用一半篩末是分赤石脂一斤以為各半斤乾薑一兩粳米一升以水七升煮米令熟去滓取七合又取半斤赤石脂末內方寸匕溫服一日三服後內赤石脂末方寸匕者未知何故也宜隨仲景之法施之外臺秘要引崔氏方阮氏桃花湯分兩法則與此不同可考品考赤石脂理膩黏苦綴唇鮮紅桃花色者為上品近年佐渡州所產者是也凡方有桃花名者以有赤石脂也又有桃花丸皆即此物耳栝樓根主治渴考證柴胡桂枝幹薑湯證曰渴而不嘔小柴胡去半夏加栝蔞湯證曰發渴者上二方栝蔞根各四兩栝蔞桂枝湯證不具栝蔞瞿麥丸證曰其人若渴上二方栝蔞根各二兩栝蔞牡蠣散證曰渴不差者牡蠣澤瀉散證不具上二方栝蔞根諸藥等分據此諸方則栝蔞根治渴明矣凡渴有二證煩渴者石膏主之但渴者栝蔞根主之是宜分別而治之按栝蔞根者蓋兼治口中燥渴及黏者然是非栝蔞根一味之主治也合用而後見其妙要宜考之於柴胡桂枝幹薑湯栝蔞桂枝湯二方互考栝蔞桂枝湯證不具然太陽病其證備云則是全備桂枝湯證之謂也但身體強几几然云者豈獨栝蔞根所主乎几几然是項背強急之狀也故桂枝加葛根湯證曰此方蓋於桂枝加葛根湯證曰項背強几几然則几几然是為葛根之證明矣余故曰此方蓋於桂枝加葛根湯方內加栝蔞根二兩煮法水率亦皆依桂枝加葛根湯法而不依桂枝湯法也豈不其徵乎然則益知此方者是桂枝加葛根湯證全備而渴者主之類聚方不載此方水率煮法者誤也牡蠣澤瀉散證不具此方七味等分之劑而不知何以為主藥也然今此謂大病瘥後從腰以下有水氣則必有渴證明矣故有栝蔞根也辨誤爾雅曰果臝之實栝蔞郭璞曰今齊人呼之為天瓜李巡曰栝蔞子名也據此說則根名果臝子名栝蔞凡仲景之方栝蔞桂枝湯栝蔞瞿麥丸柴胡去半夏加栝蔞湯及牡蠣澤瀉散柴胡桂枝幹薑湯二方內栝蔞皆當作果臝若作栝蔞則當須加根字不然與子相混不可不改焉又小陷胸湯瓜蔞薤白白酒湯瓜蔞薤白半夏湯枳實薤白桂枝湯方內瓜蔞實皆當作栝蔞也實字當削之李時珍曰栝蔞即果臝二字音轉也亦作𦸈𧁾後人又轉為瓜蔞愈轉愈失其真矣時珍之說非也栝蔞決非果臝音轉也爾雅豈以音轉註之乎瓜蔞𦸈𧁾後世假栝蔞之音者也𦸈𧁾本見靈樞經蓋俗字誤見於經後人所作乎栝蔞非果臝之音轉可知矣品考栝蔞二品其色赤一其色黃但其根不異通用而可也雷斅曰圓者為栝長者為蔞亦屬牽強今藥肆所有者土瓜根混賣不可不擇也蓋土瓜根短如甘薯味苦天瓜長如薯蕷最大味甘微苦宜以此分別也若無此物則天花粉可權用其色如雪握之又作雪聲不貼銀器者佳蜀漆主治胸腹及臍下動劇者故兼治驚狂火逆瘧疾考證桂枝去芍藥加蜀漆龍骨牡蠣救逆湯證曰驚狂起臥不安者牡蠣湯證曰牡瘧上二方蜀漆各三兩牡蠣澤瀉散證不具蜀漆散證曰牡瘧多寒者上二方蜀漆諸藥等分據此諸方則蜀漆之為功古來未嘗謂治動矣然瘧疾及驚狂火逆諸證必有胸腹臍下動劇者故見其有動者而用之則法證無不治者然則蜀漆者治胸腹及臍下動劇者明矣互考牡蠣湯服法曰吐則勿更服今瘧疾有喘鳴急迫或自汗或不汗胸腹動劇者服之則其人必吐水數升而無其證不愈者若有不吐者則其證不愈也由此觀之蜀漆能吐水毒動是水毒明矣當知瘧之為病亦水毒之所為矣雖然此方豈惟治瘧疾乎凡病人喘鳴迫塞或自汗或不汗胸腹動劇皆此方能治之往來寒熱發作有時所以不豫也晉唐以來世醫之見仲景之方也皆以為惟治傷寒者故如彼葛洪孫思邈王燾許叔微之書皆知備仲景之方於傷寒門而未嘗知治萬病矣殊不知仲景本取治萬病之方以治傷寒矣降至趙宋之時有金匱要略之書當時如王洙得仲景治傷寒中雜病證之方於蠹簡之中而後各分其門以為一書世之為醫者遂稱其書謂之金匱玉函之方金匱之玉函之蓋尊重之至也自此以往世之為醫者又見某門之方以為某方惟治某證於是乎如牡蠣湯蜀漆散二方亦署諸瘧疾篇內而徒知治瘧疾未嘗知治余病矣甚之束之高閣而謂古方不宜今病可勝嘆哉嗚呼仲景之方法之衰也不獨王叔和為之彼葛孫王許實為之又醫道之大罪人乎哉桂枝去芍藥加蜀漆龍骨牡蠣救逆湯證曰驚狂起臥不安杶按此證者是外證也凡仲景之為法不獨以外證治之且並診內外治之故無胸腹及臍下動者若雖有驚狂起臥不安證亦非此方所宜也嗚呼是吾東洞翁千古卓識吾儕豈不奉此乎哉蜀漆散證不具且云牡瘧蓋牡瘧者獨展不熱非無熱也多寒也夫瘧之為病先其寒而後其熱雖然不可以寒熱治瘧則豈無內候在乎曰必有臍下動劇矣故仲景嘗以龍骨主之以蜀漆佐之醫者其察諸牡蠣澤瀉散證不具然以仲景用牡蠣之方推之則其證必有胸腹之動劇苟有胸腹之動劇則無有不加蜀漆之方由此觀之蓋此方治水腫胸腹之動劇而渴者明矣方極可考凡仲景之治動也其活法有三有胸腹之動則以牡蠣治之有臍下之動則以龍骨治之有胸腹臍下之動劇則以蜀漆治之此為仲景治動之三活法矣故仲景之方有以蜀漆配之牡蠣者或有配之龍骨者或有配之龍骨牡蠣者是又仲景用蜀漆之法也本論不載此法者蓋屬脫誤故晉唐以來無有知蜀漆之功者而諸病之有動者最多則動之為病也為諸病內候之主證而最為難治者雖然二千年來諸醫之說諸家本草何其不載龍骨牡蠣蜀漆之本功矣乎或云牡蠣之咸消胸腹之滿或云龍骨牡蠣收斂神氣或云蜀漆辛以散之或云龍骨牡蠣之澀以固之未嘗見言及治動之功者又未嘗知動之為諸病內候之主證也吾東洞翁生於二千年之下始知龍骨牡蠣蜀漆之功其說詳於本條之下是誠二千年來不傳之說而翁獨得其旨者不亦偉乎韓退之嘗推尊孟子以為功不在禹之下余以為翁之有功於我醫不在仲景之下矣是非余之過論也品考蜀漆乃常山苗其功與常山同蜀漆無華舶來之物常山者華物為良和產多偽品若無蜀漆則常山可以權用本邦亦多產醫者或未知此物生薑主治嘔故兼治乾嘔噫噦逆考證小半夏湯證曰嘔吐谷不得下小半夏加茯苓湯證曰卒嘔吐又曰先渴後嘔厚朴生薑半夏甘草人參湯證不具橘皮湯證曰乾嘔噦橘皮竹茹湯證曰噦逆橘皮枳實生薑湯證不具以上六方生薑各半斤生薑半夏湯證不具上一方生薑汁一升黃耆桂枝五物湯證不具吳茱萸湯證曰食谷欲嘔又曰乾嘔又曰嘔而胸滿上二方生薑各六兩大柴胡湯證曰嘔不止又曰嘔吐生薑甘草湯證曰咳唾涎沫不止梔子生薑豉湯證曰嘔旋覆花代赭石湯證曰噫氣不除厚朴七物湯證不具厚朴半夏湯證不具當歸生薑羊肉湯證不具以上七方生薑各五兩茯苓澤瀉湯證曰吐而渴生薑瀉心湯證曰乾噫食臭茯苓飲證曰自吐出水以上三方生薑各四兩桂枝湯證曰乾嘔凡桂枝湯出入諸方皆仿之真武湯證曰嘔黃芩加半夏生薑湯證曰嘔桂枝枳實生薑湯證曰諸逆茯苓甘草湯證不具以上五方生薑各三兩乾薑人參半夏丸證曰嘔吐不止上一方生薑汁糊丸據此諸方則生薑但治嘔也噦逆噫氣乾嘔或乾噫食臭皆嘔吐輕證也故加咳唾涎沫不止似噦不噦亦生薑所兼治也豈不嘔之餘證乎互考凡仲景之方二百十餘方而其內用生薑之方六十有餘首並用大棗之方四十有七首又其內生薑五兩對大棗十二枚之方二首十二枚乃四兩之例若去核則為三兩對十枚之方一首十枚乃三兩八銖之例對十五枚之方一首十五枚乃五兩之例生薑六兩對大棗十二枚之方一首生薑四兩對大棗十二枚之方一首生薑一兩對大棗十枚之方一首生薑半斤對大棗三十枚之方一首三十枚者十兩之例如此數方無不專取生薑大棗之功者又桂枝湯去加之方二十有六首及越婢湯之方三首葛根湯之方二首小柴胡湯之方五首文蛤湯防己黃耆湯以上十三方凡三十有九首皆以生薑三兩對大棗十二枚雖他品加減之亦至生薑大棗無有變之者何也其證不變故乎又別有妙用乎由此觀之姜與棗者雖為日用餌食之物亦仲景方內二味必相對者多則蓋似有調和之意故後世謬仿之方後必有謂薑棗水煎者雖似取仲景之法亦未知其本功之所在也殊不知生薑大棗之於其證也每方必有其所治之毒矣宜以桂枝湯小柴胡湯二方之證徵之若以日用餌食之物推之則如粳米赤小豆大小麥香豉酒酢飴蜜白酨酒薤蔥之類其謂之何矣杶以為如此諸品亦或有所建單用之功者或有所助諸藥之毒者余故曰不可以日用餌食之物推之然夫如姜與棗亦別有大勇力者矣宜以考證中諸方察之夫孔子每食不撤姜曾晰常嗜羊棗亦不可以藥中薑棗見之今以此為治病之材則又有大攻毒之功凡藥材以餌食見之則至桂枝究矣古者薑桂棗慄以為燕食庶羞之品故內則曰棗慄薑桂呂覽有言和之美者陽樸之姜招搖之桂是乃古人所常食之物也又何毒之有雖然良醫橐而藥之則雖穀肉果菜亦皆為治病良材而無有所不驅除其病毒者東洞翁有言曰藥之為毒毒即能能即毒知言哉夫生薑之治嘔也猶桂枝之治上衝大棗之治拘攣矣當此時豈以日用餌食之物論之乎是以至大棗生薑相對之方則又有所合治之功也如其量法多少則其功用亦有所不同者也集驗方外臺秘要所引療肺痿有生薑五兩甘草二兩大棗十二枚之方古今錄驗同上療上氣有甘草三兩桂枝四兩生薑一斤之方由是觀之桂枝與薑棗豈以日用餌食之物論之乎況又於其單用獨立之方乎醫者其詳諸厚朴生薑半夏甘草人參湯證不具但云發汗後腹脹滿者主之脹滿是厚朴之所主也今其生薑為半斤半夏為半升豈無嘔吐兼發之證矣乎方極類聚方可並考桂枝枳實生薑湯證曰心中痞諸逆心懸痛東洞翁曰痞下疑脫滿字今因此說則心中痞滿者是枳實之所主而諸逆者蓋上逆吐逆嘔逆之謂也上逆者桂枝之所治也吐逆嘔逆者生薑之所治也橘皮枳實生薑湯證不具杶按此方蓋橘皮之證多故為一斤枳實之證少故為三兩今加生薑半斤者豈無有嘔證多矣乎哉故此方嘔證不具者蓋屬闕文宜以諸湯加生薑半斤之方推知之黃耆桂枝五物湯證不具此方本於桂枝加黃耆湯方內加黃耆一兩足前成三兩生薑三兩足前成六兩而去甘草二兩但煮法水率不同耳故東洞翁曰桂枝加黃耆湯證而嘔不急迫者主之是所以生薑之為六兩也厚朴七物湯證不具此方雖生薑大棗相對亦生薑多於大棗則豈得無嘔證不具乎故東洞翁曰此方於厚朴三物湯桂枝去芍藥湯二方內更加生薑二兩足前成五兩蓋二方證而嘔者主之半夏厚朴湯證曰婦人咽中如有炙臠豈因有此一證而得用此方乎今依千金方則作治胸滿心下堅按千金方及冀硬字皆作堅此堅字亦硬字也咽中帖帖如有炙肉臠吐之不出咽之不下是吐之不出咽之不下似有嘔逆之狀故有生薑五兩半夏一升此方豈惟婦人之治耶雖男子亦有此證則宜施之當歸生薑羊肉湯證不具此方未試之故今略之茯苓甘草湯證不具杶按此方之證以有茯苓生薑各三兩觀之則有悸無嘔者蓋屬脫誤也故東洞翁曰當有沖逆而嘔證余曰心下悸上衝而嘔者此方主之屢試屢驗生薑半夏湯證曰病人胸中似喘不喘似嘔不嘔似噦不噦徹心中憒憒然無奈杶按是疑非此方全證何則生薑半夏之為功本惟治嘔吐然今於此方何其謂似嘔不嘔乎若其然則似無生薑半夏之所治之證矣由是觀之似嘔不嘔四字蓋屬衍文而有嘔吐之證不具可知矣雖然似喘不喘似噦不噦者似有嘔吐兼發之證故今煮半夏半升以內生薑汁一升者是欲大取生薑之功也余故曰半夏能治嘔吐兼發者生薑能治但嘔者又能治嘔多吐少者故方內有生薑半夏並用者則必謂嘔吐或謂卒嘔吐或謂嘔吐不止若有生薑而無半夏則謂但嘔或謂乾嘔或謂乾嘔噦或謂噦逆或謂食谷欲嘔或謂嘔而胸滿或謂諸逆是可以徵焉然則此方治嘔吐兼發者明矣故法曰嘔止停後服豈其謂似嘔不嘔而後謂嘔止停後服可乎茯苓澤瀉湯方生薑四兩但云胃反吐而渴欲飲水者今有吐而無嘔者蓋屬脫誤因屢試此方若施無嘔者則未嘗見奏其效者若施之吐後但嘔而渴者則其效之速也如桴鼓相應然由此觀之此方能治病人胃反嘔而渴欲飲水者夫胃反者吐食也然則此胃反吐之吐字蓋嘔字之誤可知矣不然屬重複若作嘔字則其義始穩當其證亦可謂具而已按嘔吐者是水毒之上逆者也桂枝能下其上逆生薑能止其嘔澤瀉朮茯苓能瀉之小便甘草能緩其嘔之急迫者益知此方之下脫嘔證明矣類聚方可並考生薑瀉心湯方有半夏半升生薑四兩而無嘔吐證者何曰乾噫食臭是乃嘔之輕證也曰然今有半夏生薑而無嘔吐兼發證者何然此方於半夏瀉心湯方內減乾薑二兩加生薑四兩豈無嘔吐兼發證乎夫半夏瀉心湯之為方治嘔而腸鳴心下痞硬者既於本方謂嘔而腸鳴故今於此方而不重舉嘔證者欲使人思得之也仲景之方多此類也然則此方略嘔證而脫吐證者歟茯苓飲證曰自吐出水方曰生薑四兩然則此方豈但吐出宿水乎必有嘔證明矣辨誤凡生薑之功詳於諸家本草雖然其說非疾醫之義蓋服餌家腐談而誤世者不為不少矣曰姜久服通神明曰姜要熱則去皮要冷則留皮曰薑製半夏厚朴之毒曰生薑屑生乾薑生薑分別用之曰姜能彊禦百邪以上諸說非疾醫之義奚俟余之言哉嗚呼如食之通神明之說則出於偽書本草經朱子嘗取此說以注論語余雖未知其是否何其說之迂也陳藏器去皮留皮之言彼豈知生薑之功在一根之中矣乎又至加彼生薑製半夏厚朴之毒之說一何盲昧之至於此乎若夫生薑製半夏之毒則仲景何用生薑半夏湯小半夏湯乎若夫生薑製厚朴之毒則仲景何用厚朴生薑半夏人參甘草湯厚朴半夏湯乎苟如李杲之言半夏厚朴實為鈍物又與不用同焉夫仲景之用生薑與半夏厚朴也則取其毒之用耳又何制之為況生薑能姜御百邪之言則時珍誤裁斷王安石姜能彊我者也於毒邪臭腥寒熱皆足以御之之說而惟云彊禦百邪於義不通安石之說猶且牽強而況於時珍之言乎是大惑後人不可從焉孫思邈曰姜為嘔家聖藥陶弘景嘗謂不撤姜食不多食言可常食但不可多爾有病者是所宜矣二子之言為得焉品考生薑宿根謂之老薑者為良霜後採之水洗塵土不必去皮惟銼用本邦醫家用生薑也徒托之病家婦女之手而未嘗問其生新否乃云生薑一斤水煎若依醫人之言則生薑者是徒加之具耳豈為治病之材乎哉醫者其宜擇生新者取其效已
